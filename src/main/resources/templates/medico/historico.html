<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Histórico do Médico - Consultório Vida</title>
</head>
<body>
<main class="container my-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-1 text-primary fw-bold">
                <i class="bi bi-clock-history me-2"></i>Histórico do Médico
            </h2>
            <p class="text-muted small mb-0">Consultas atendidas ou agendadas para este médico</p>
        </div>
        <a th:href="@{/medicos/list}" class="btn btn-outline-secondary shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Voltar para Lista
        </a>
    </div>

    <!-- Doctor Info Card -->
    <div class="card shadow-sm border-0 mb-4" th:if="${medico != null}">
        <div class="card-body p-4">
            <div class="row align-items-center">
                <div class="col-md-7">
                    <h4 class="text-dark fw-bold mb-2">
                        <i class="bi bi-person-badge text-primary me-2"></i>
                        <span th:text="${medico.nome}"></span>
                    </h4>
                    <div class="d-flex flex-wrap gap-3 text-muted small">
                        <span><i class="bi bi-award me-1"></i><strong>CRM:</strong> <span class="badge bg-secondary" th:text="${medico.crm}"></span></span>
                        <span><i class="bi bi-card-heading me-1"></i><strong>CPF:</strong> <span th:text="${medico.cpf}"></span></span>
                    </div>
                </div>
                <div class="col-md-5 text-md-end mt-3 mt-md-0">
                    <p class="mb-1 text-muted small"><i class="bi bi-envelope me-1"></i><span th:text="${medico.email}"></span></p>
                    <p class="mb-0 text-muted small"><i class="bi bi-telephone me-1"></i><span th:text="${medico.telefone}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Consultas Table -->
    <div class="card shadow-sm border-0" th:if="${consultas != null and !consultas.empty}">
        <div class="card-header bg-white py-3 border-bottom">
            <h5 class="card-title mb-0 fw-bold text-dark">
                <i class="bi bi-calendar-check me-2 text-primary"></i>Consultas Realizadas / Agendadas
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Data e Hora</th>
                        <th>Paciente</th>
                        <th>Valor</th>
                        <th class="pe-3">Observação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${consultas}">
                        <td class="ps-3 fw-semibold text-secondary" th:text="${c.id}"></td>
                        <td>
                            <i class="bi bi-calendar3 me-1 text-primary"></i>
                            <span th:text="${c.date}"></span>
                        </td>
                        <td>
                            <i class="bi bi-person me-1 text-info"></i>
                            <span class="fw-semibold" th:text="${c.paciente != null ? c.paciente.nome : 'Sem Paciente'}"></span>
                        </td>
                        <td class="fw-bold text-success">
                            <span th:text="${c.value != null ? 'R$ ' + c.value : 'R$ 0.00'}"></span>
                        </td>
                        <td class="pe-3 text-muted" th:text="${c.observation != null and !c.observation.empty ? c.observation : '-'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div class="alert alert-info d-flex align-items-center shadow-sm" role="alert" th:if="${consultas == null or consultas.empty}">
        <i class="bi bi-info-circle-fill fs-4 me-3"></i>
        <div>
            Nenhuma consulta registrada para este médico até o momento.
        </div>
    </div>

</main>
</body>
</html>
