<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Lista de Pacientes - Consultório Vida</title>
</head>
<body>
<main class="container my-4 flex-grow-1">

    <!-- Mensagem de redirecionamento (item 1.7 do material) -->
    <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${mensagem}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-1 text-primary fw-bold">
                <i class="bi bi-people-fill me-2"></i>Lista de Pacientes
            </h2>
            <p class="text-muted small mb-0">Gerencie o cadastro de pacientes da clínica</p>
        </div>
        <a th:href="@{/pacientes/form}" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus-fill me-1"></i> Novo Paciente
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Convênio</th>
                        <th class="text-center">Histórico</th>
                        <th class="text-center pe-3">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pacientes}">
                        <td class="ps-3 fw-semibold text-secondary" th:text="${p.id}"></td>
                        <td class="fw-bold text-dark" th:text="${p.nome}"></td>
                        <td th:text="${p.cpf}"></td>
                        <td th:text="${p.email}"></td>
                        <td th:text="${p.telefone}"></td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${p.convenio != null and !p.convenio.empty ? p.convenio : 'Particular'}"></span>
                        </td>
                        <td class="text-center">
                            <a class="btn btn-outline-info btn-sm" th:href="@{/pacientes/historico/{id}(id=${p.id})}" title="Ver Histórico de Consultas">
                                <i class="bi bi-clock-history me-1"></i> Ver Histórico
                            </a>
                        </td>
                        <td class="text-center pe-3">
                            <div class="btn-group btn-group-sm" role="group">
                                <a class="btn btn-outline-warning" th:href="@{/pacientes/edit/{id}(id=${p.id})}" title="Editar Paciente">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a class="btn btn-outline-danger" th:href="@{/pacientes/remove/{id}(id=${p.id})}"
                                   onclick="return window.confirm('Tem certeza que deseja excluir este paciente?')" title="Excluir Paciente">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pacientes)}">
                        <td colspan="8" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Nenhum paciente cadastrado no momento.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
</body>
</html>
