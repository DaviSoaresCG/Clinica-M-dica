<header th:fragment="header" class="mb-4" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/consultas/list}">
                <i class="bi bi-heart-pulse-fill me-2 fs-4 text-warning"></i>
                <span>Consultório Vida</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Pacientes -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-people me-1 text-light"></i> Pacientes
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/pacientes/list}"><i class="bi bi-list-ul me-2 text-primary"></i>Lista de Pacientes</a></li>
                            <li><a class="dropdown-item" th:href="@{/pacientes/form}"><i class="bi bi-person-plus me-2 text-success"></i>Novo Paciente</a></li>
                        </ul>
                    </li>
                    <!-- Médicos -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-badge me-1 text-light"></i> Médicos
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li><a class="dropdown-item" th:href="@{/medicos/list}"><i class="bi bi-list-ul me-2 text-primary"></i>Lista de Médicos</a></li>
                            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/medicos/form}"><i class="bi bi-person-plus me-2 text-success"></i>Novo Médico</a></li>
                        </ul>
                    </li>
                    <!-- Consultas -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-calendar2-week me-1 text-light"></i> Consultas
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li><a class="dropdown-item" th:href="@{/consultas/list}"><i class="bi bi-calendar-check me-2 text-primary"></i>Lista de Consultas</a></li>
                            <li><a class="dropdown-item" th:href="@{/consultas/form}"><i class="bi bi-calendar-plus me-2 text-success"></i>Nova Consulta</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="btn btn-outline-light btn-sm fw-semibold" sec:authorize="isAuthenticated()" th:href="@{/consultas/form}">
                        <i class="bi bi-plus-circle me-1"></i> Nova Consulta
                    </a>
                    <span class="text-white small me-1" sec:authorize="isAuthenticated()">
                        Olá, <strong sec:authentication="name">usuário</strong>
                    </span>
                    <a class="btn btn-outline-light btn-sm fw-semibold" sec:authorize="!isAuthenticated()" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
