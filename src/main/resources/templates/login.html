<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Consultório Vida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-heart-pulse-fill text-primary fs-1"></i>
                <h1 class="h3 fw-bold text-primary mt-2 mb-1">Consultório Vida</h1>
                <p class="text-muted small mb-0">Acesse o sistema com seu usuário e senha</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span>Usuário ou senha inválidos.</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span>Você saiu do sistema.</span>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h2 class="h5 mb-0 fw-semibold">
                        <i class="bi bi-shield-lock me-2"></i>Informe usuário e senha
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input id="username" name="username" class="form-control"
                                       placeholder="Digite seu usuário" required autofocus autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input id="password" name="password" type="password" class="form-control"
                                       placeholder="Digite sua senha" required autocomplete="current-password">
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                            <label for="remember-me" class="form-check-label">Lembrar de mim</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center py-3">
                    <a th:href="@{/pacientes/form}" class="text-decoration-none small">
                        <i class="bi bi-person-plus me-1"></i> Cadastrar novo paciente
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
