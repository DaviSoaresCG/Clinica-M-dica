<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Lista de Consultas - Consultório Vida</title>
</head>
<body>
<main class="container my-4 flex-grow-1">

    <!-- Mensagens Flash de Notificação -->
    <div th:if="${mensagem != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensagem}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div th:if="${mensagemErro != null}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 mb-1 text-primary fw-bold">
                <i class="bi bi-calendar2-week-fill me-2"></i>Lista de Consultas
            </h2>
            <p class="text-muted small mb-0">Gerencie todos os agendamentos e atendimentos clínicos</p>
        </div>
        <a th:href="@{/consultas/form}" class="btn btn-primary shadow-sm">
            <i class="bi bi-calendar-plus-fill me-1"></i> Nova Consulta
        </a>
    </div>

    <!-- Barra de Filtro / Consulta com Validação -->
    <div class="card shadow-sm border-0 mb-4 bg-white">
        <div class="card-body py-3">
            <form th:action="@{/consultas/list}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9 col-sm-8">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" name="busca" class="form-control"
                               placeholder="Filtrar por nome do médico, paciente ou observação..."
                               th:value="${busca}" maxlength="50">
                    </div>
                </div>
                <div class="col-md-3 col-sm-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-funnel me-1"></i> Filtrar
                    </button>
                    <a th:if="${busca != null and !busca.empty}" th:href="@{/consultas/list}" class="btn btn-outline-secondary" title="Limpar Filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Data e Hora</th>
                        <th>Valor</th>
                        <th>Médico</th>
                        <th>Paciente</th>
                        <th>Observação</th>
                        <th class="text-center pe-3">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${consultas}">
                        <td class="ps-3 fw-semibold text-secondary" th:text="${c.id}"></td>
                        <td>
                            <i class="bi bi-calendar-event me-1 text-primary"></i>
                            <span th:text="${c.date}"></span>
                        </td>
                        <td class="fw-bold text-success">
                            <span th:text="${c.value != null ? 'R$ ' + c.value : 'R$ 0.00'}"></span>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">
                                <i class="bi bi-person-badge text-primary me-1"></i>
                                <span th:text="${c.medico != null ? c.medico.nome : 'Sem médico'}"></span>
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">
                                <i class="bi bi-person text-info me-1"></i>
                                <span th:text="${c.paciente != null ? c.paciente.nome : 'Sem paciente'}"></span>
                            </span>
                        </td>
                        <td class="text-muted small" th:text="${c.observation != null and !c.observation.empty ? c.observation : '-'}"></td>
                        <td class="text-center pe-3">
                            <div class="btn-group btn-group-sm" role="group">
                                <a class="btn btn-outline-warning" th:href="@{/consultas/edit/{id}(id=${c.id})}" title="Editar Consulta">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a class="btn btn-outline-danger" th:href="@{/consultas/remove/{id}(id=${c.id})}"
                                   onclick="return window.confirm('Tem certeza que deseja excluir esta consulta?')" title="Excluir Consulta">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(consultas)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Nenhuma consulta encontrada.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
</body>
</html>
